<title>Beamwork Mapper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a lighting console. Top bar switches Mapping / Play, the black stage fills the middle, a contextual panel sits right, a scene or tool bar runs along the bottom. Stacks on phones. */
:root{
  --bg:#0c0e12; --panel:#13161c; --raise:#1b1f28; --line:#272c36;
  --fg:#ebe7df; --muted:#8e94a1; --accent:#ffb547; --accent-ink:#1d1305;
  --ok:#4ade80; --danger:#ff6464; --map:#7cc4ff;
  --display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}

#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.left{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.lens{width:20px;height:20px;border-radius:50%;flex:none;background:radial-gradient(circle,#fff 0 18%,var(--accent) 30%,transparent 72%),#000;box-shadow:0 0 12px rgba(255,181,71,.5)}
.pname{background:none;border:0;padding:4px 6px;border-radius:6px;font-family:var(--display);font-stretch:112%;font-weight:700;font-size:16px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.pname:hover{background:var(--raise)}
.seg{display:flex;background:#07080a;border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{background:none;border:0;border-radius:6px;padding:7px 18px;font-family:var(--display);font-stretch:115%;font-weight:700;letter-spacing:.05em;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.seg button i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5}
.seg button[aria-selected="true"]{background:var(--raise);color:var(--fg)}
.seg button[data-mode="map"][aria-selected="true"] i{background:var(--map);opacity:1}
.seg button[data-mode="play"][aria-selected="true"] i{background:var(--accent);opacity:1}
.right{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;flex:1}

.btn,.icon,.tog{background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:7px 11px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-height:34px}
.btn:hover,.icon:hover,.tog:hover{border-color:#3b4251}
.icon{padding:6px 8px}
.icon svg,.btn svg{width:17px;height:17px}
.tog[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:7px;padding:8px 15px;font-weight:800;font-family:var(--display);font-stretch:112%;letter-spacing:.03em;display:inline-flex;gap:8px;align-items:center;justify-content:center;min-height:34px}
.primary:hover{filter:brightness(1.08)}
.ghost{background:none;border:1px dashed var(--line);border-radius:7px;padding:6px 10px;font-size:12px;color:var(--muted)}
.ghost:hover{color:var(--fg);border-color:var(--muted)}
.danger{color:var(--danger)}
button:disabled{opacity:.38;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:5px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:#555}
.pill.on{color:var(--ok);border-color:rgba(74,222,128,.4)}
.pill.on i{background:var(--ok);box-shadow:0 0 8px var(--ok)}

.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px}
.center{display:flex;flex-direction:column;min-width:0;min-height:0;background:#07080a}
#stageWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:26px 18px 18px;position:relative;overflow:hidden}
#stageFrame{position:relative;background:#000;box-shadow:0 0 0 1px #2a2f3a,0 20px 60px rgba(0,0,0,.6)}
#stageFrame canvas,#refImg{position:absolute;inset:0;width:100%;height:100%}
#refImg{object-fit:cover;pointer-events:none;max-width:none}
#stage{touch-action:none}
.tick{position:absolute;width:12px;height:12px;border-style:solid;border-color:var(--accent);opacity:.8}
.mode-map .tick{border-color:var(--map)}
.tick.tl{left:-7px;top:-7px;border-width:2px 0 0 2px}.tick.tr{right:-7px;top:-7px;border-width:2px 2px 0 0}
.tick.bl{left:-7px;bottom:-7px;border-width:0 0 2px 2px}.tick.br{right:-7px;bottom:-7px;border-width:0 2px 2px 0}
.stageMeta{position:absolute;left:0;top:-21px;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.05em;white-space:nowrap}
#blackBadge{position:absolute;right:8px;top:8px;background:var(--danger);color:#1a0505;font-family:var(--display);font-stretch:118%;font-weight:800;font-size:11px;letter-spacing:.12em;padding:3px 8px;border-radius:4px}
.zoom{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:12px;display:flex;gap:4px;background:rgba(19,22,28,.9);border:1px solid var(--line);border-radius:8px;padding:3px}
.zoom button{background:none;border:0;min-width:30px;height:28px;border-radius:5px;font-weight:700;color:var(--fg);font-size:13px}
.zoom button:hover{background:var(--raise)}
.zoom output{font-family:var(--mono);font-size:11px;color:var(--muted);align-self:center;min-width:38px;text-align:center}

.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--panel);min-height:56px;font-size:13px;color:var(--muted)}
.bar b{color:var(--fg);font-weight:600}
.bar .sp{flex:1}
.addBig{font-size:20px;line-height:1;width:38px;height:38px;padding:0;border-radius:50%}
.scenes{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;padding-block:2px;scrollbar-width:thin}
.scene{flex:none;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:5px 10px 5px 6px;display:flex;align-items:center;gap:8px;color:var(--fg);font-size:13px;min-height:38px}
.scene.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.scene .chipsw{display:flex;gap:2px}
.scene .chipsw i{width:7px;height:22px;border-radius:2px}
.scene .n{font-family:var(--mono);font-size:10px;color:var(--muted)}
.autoBox{display:flex;align-items:center;gap:6px;flex:none}
.autoBox select{background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:6px;min-height:34px}
kbd{font-family:var(--mono);font-size:11px;background:var(--raise);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--fg)}

.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-width:0}
.panel section{padding:16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
h2,.eyebrow{font-family:var(--display);font-stretch:118%;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
.pHead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:16px 16px 12px}
.pHead strong{display:block;font-family:var(--display);font-stretch:108%;font-size:17px;font-weight:700;margin-top:3px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shapeGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.shapeTile{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.shapeTile:hover{border-color:var(--map)}
.shapeTile svg{width:30px;height:30px;color:var(--map)}
.tools2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tools2 .btn,.tools2 .tog{justify-content:flex-start}
.note{font-size:12px;color:var(--muted);margin:0}
.linked{font-size:12px;color:var(--map);display:flex;gap:8px;align-items:center;justify-content:space-between}

#layers{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
#layers li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;border:1px solid transparent;cursor:pointer}
#layers li:hover{background:var(--raise)}
#layers li.sel{background:var(--raise);border-color:var(--accent)}
.sw{width:14px;height:14px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.sname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp{font-family:var(--mono);font-size:10px;color:var(--map)}
.li-b{background:none;border:0;padding:2px;color:var(--muted)}
.li-b svg{width:15px;height:15px}
.li-b.off{opacity:.4}
.li-b:hover{color:var(--fg)}

.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 8px;position:sticky;top:0;background:var(--panel);z-index:2}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 4px;color:var(--muted);font-size:13px;font-weight:600}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pane{padding:14px 16px 26px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
.chips button[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.lib{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pcard{background:none;border:1px solid var(--line);border-radius:7px;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;position:relative;color:var(--fg)}
.pcard canvas{width:100%;aspect-ratio:16/10;display:block;background:#000}
.pcard span{font-size:11px;padding:5px 6px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard:hover{border-color:#4a5262}
.pcard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pcard .x{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.7);color:#fff;border-radius:4px;width:20px;height:20px;font-size:13px;line-height:20px;padding:0;text-align:center}
.lib .none{grid-column:1/-1;color:var(--muted);font-size:12px;margin:0}
.ctl{display:flex;flex-direction:column;gap:5px}
.ctl label,.lbl{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
output{font-family:var(--mono);font-size:11px;color:var(--fg);font-variant-numeric:tabular-nums}
input[type=text],input:not([type]),select,textarea{background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
textarea{font-family:var(--mono);font-size:11px;min-height:170px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
input[type=color]{width:100%;height:36px;padding:2px;background:var(--raise);border:1px solid var(--line);border-radius:7px}
.row2{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.checks{display:flex;gap:16px;flex-wrap:wrap}
.checks label{display:flex;gap:7px;align-items:center;font-size:13px}
.pal button{display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.pal i{width:18px;height:10px;border-radius:2px;display:inline-block}
.btnRow{display:flex;gap:6px;flex-wrap:wrap}
.btnRow>*{flex:1}
.divider{height:1px;background:var(--line);margin:2px 0}
.meter{height:6px;border-radius:3px;background:var(--raise);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--ok)}
.sceneRow{display:flex;gap:6px;align-items:center}
.sceneRow input{flex:1;min-width:0}

/* output */
#proj{position:fixed;inset:0;background:#000;z-index:50;cursor:none}
#proj.awake{cursor:default}
#proj.out,#proj.out.awake{cursor:none}
#projGL,#projCv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.floatUI{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:8px;opacity:0;transition:opacity .4s;z-index:2}
#proj.awake .floatUI{opacity:1}
#proj.awake.out .floatUI{opacity:0}
.fl{left:calc(14px + env(safe-area-inset-left,0px))}
.fr{right:calc(14px + env(safe-area-inset-right,0px))}
#backBtn{width:46px;height:46px;border-radius:50%;background:rgba(20,20,20,.55);border:1px solid rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center}
#backBtn svg{width:22px;height:22px}
#proj .seg{background:rgba(10,10,10,.6)}
#outHint{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(20,20,20,.8);color:#ddd;padding:10px 16px;border-radius:8px;font-size:14px;text-align:center;transition:opacity .8s;max-width:90%}

/* home */
#home{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto}
.homeIn{max-width:1100px;margin:0 auto;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.homeTop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.homeTop h1{font-family:var(--display);font-stretch:125%;font-weight:800;letter-spacing:.04em;font-size:30px;margin:0;margin-right:auto;text-wrap:balance}
.homeTop p{margin:0;color:var(--muted);flex-basis:100%;max-width:65ch}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.proj{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.proj.cur{border-color:var(--accent)}
.proj .th{aspect-ratio:16/9;width:100%;display:block;background:#000;border:0;padding:0;cursor:pointer}
.proj .th canvas{width:100%;height:100%;display:block}
.proj .meta{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.proj .meta b{font-family:var(--display);font-stretch:108%;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .meta span{font-size:12px;color:var(--muted)}
.proj .acts{display:flex;gap:4px;padding:0 10px 10px;flex-wrap:wrap}
.proj .acts button{flex:1;font-size:12px;padding:5px 6px;min-height:30px}
.newProj{border:1px dashed var(--line);border-radius:10px;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:200px;font-size:14px}
.newProj span{font-size:34px;color:var(--accent);line-height:1}
.newProj:hover{border-color:var(--accent);color:var(--fg)}

#modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:560px;width:100%;max-height:90%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.mbox h3{font-family:var(--display);font-stretch:118%;font-weight:800;font-size:20px;margin:0;text-wrap:balance}
.mbox ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:65ch}
.mbox p{margin:0;color:var(--muted);max-width:65ch}
.mbox h4{margin:4px 0 0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-family:var(--display);font-stretch:118%}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:12px;color:var(--fg)}
.opt:hover{border-color:var(--accent)}
.opt b{display:block;font-size:14px;margin-bottom:2px}
.opt span{font-size:12px;color:var(--muted)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:7px;font-size:13px;font-weight:600;z-index:90;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
#noGL{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--danger);color:#1a0505;padding:10px 14px;border-radius:8px;z-index:70;font-weight:600;max-width:90%}

@media (max-width:1000px){.work{grid-template-columns:minmax(0,1fr) 290px}.pname{max-width:150px}}
@media (max-width:820px){
  body{overflow:auto}
  #app{height:auto;min-height:100%}
  .work{display:flex;flex-direction:column}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  #stageWrap{padding:26px 10px 50px}
  .right .hideS{display:none}
  .seg button{padding:7px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app" class="mode-play">
  <header class="top">
    <div class="left">
      <button class="icon" id="homeBtn" title="All projects" aria-label="All projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
      <span class="lens" aria-hidden="true"></span>
      <button class="pname" id="projName" title="Rename project">Project</button>
    </div>
    <div class="seg" role="tablist" aria-label="Mode">
      <button role="tab" data-mode="map" aria-selected="false"><i></i>MAPPING</button>
      <button role="tab" data-mode="play" aria-selected="true"><i></i>PLAY</button>
    </div>
    <div class="right">
      <button class="icon" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="icon" id="redoBtn" title="Redo" aria-label="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button class="tog hideS" id="blackBtn" aria-pressed="false" title="Blackout (B)">Blackout</button>
      <button class="pill hideS" id="outPill" title="Projector connection"><i></i><span>No output</span></button>
      <button class="primary" id="goProj" title="Open the projector view in a new tab (P)">Projector view <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg></button>
    </div>
  </header>

  <main class="work">
    <div class="center">
      <div id="stageWrap">
        <div id="stageFrame">
          <span class="stageMeta" id="stageMeta"></span>
          <img id="refImg" alt="" hidden><canvas id="stageGL"></canvas><canvas id="stage" aria-label="Mapping stage"></canvas>
          <span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span>
          <span id="blackBadge" hidden>BLACKOUT</span>
        </div>
        <div class="zoom"><button id="zOut" aria-label="Zoom out">−</button><output id="zVal">100%</output><button id="zIn" aria-label="Zoom in">+</button><button id="zFit">Fit</button></div>
      </div>
      <footer class="bar" id="bar"></footer>
    </div>
    <aside class="panel" id="panel"></aside>
  </main>
</div>

<section id="proj" hidden>
  <canvas id="projGL"></canvas><canvas id="projCv"></canvas>

/* ---------- loop ---------- */

  const lvl=OUT?REMOTE.lvl:AUD.lvl;
  for(const s of P.shapes){ const r=rtFor(s), k=s.style.speed*P.speedAll*(1+(s.style.react||0)*lvl*2); r.dt=dt*k; r.time+=r.dt; }

/* ---------- pointer editing ---------- */

/* ---------- shape creation ---------- */

  $('#clearVis').onclick=()=>{ s.style={...DEF,mask:s.style.mask}; s.preset=null; commit(); renderPanel(); };
  $('#randBtn').onclick=()=>{ const pool=Object.keys(FX).filter(k=>!['none','empty','text','strobe','media'].includes(k)), h=Math.random()*360, c=document.createElement('canvas').getContext('2d'), hsl=(h,l)=>{ c.fillStyle=`hsl(${h},95%,${l}%)`; return c.fillStyle; };
    s.style={...s.style,effect:pool[Math.random()*pool.length|0],a:hsl(h,60),b:hsl((h+120+Math.random()*120)%360,45),speed:+(0.5+Math.random()*1.3).toFixed(2),density:2+(Math.random()*7|0),angle:(Math.random()*12|0)*30,kal:Math.random()<.25?[4,6,8][Math.random()*3|0]:0};
    s.preset=null; commit(); renderPanel(); };
  $$('#panel [data-k]').forEach(el=>{ const k=el.dataset.k;
    el.addEventListener('input',()=>{ s.style[k]=el.type==='checkbox'?el.checked:el.type==='range'?parseFloat(el.value):el.value; const o=$('#o_'+k); if(o) o.textContent=FMT[k]?FMT[k](s.style[k]):s.style[k]; if(k==='effect') syncInputs(s); touch(); });
    el.addEventListener('change',()=>{ if(k==='effect'){ s.preset=null; } commit(); }); });
  $('#swapAB').onclick=()=>{ [s.style.a,s.style.b]=[s.style.b,s.style.a]; commit(); syncInputs(s); };
  $('#palChips').onclick=e=>{ const b=e.target.closest('[data-pal]'); if(!b) return; const p=PALETTES.find(p=>p[0]===b.dataset.pal); s.style.a=p[1]; s.style.b=p[2]; commit(); syncInputs(s); };
  $('#fxReset').onclick=()=>{ FX_KEYS.forEach(k=>s.style[k]=DEF[k]); commit(); syncInputs(s); };
}
const thumbCache=new Map();
function thumb(style,cv){
  cv.width=128; cv.height=80; const c=cv.getContext('2d'), st={}, w=128, h=80;
  if(style.effect==='media'){ drawMedia(c,w,h,null,style,0); }
  else{ let t=1.5, ret=null; const f=FX[style.effect]||FX.solid; for(let i=0;i<(['fire','matrix','sparkle','starfield','snow','lightning'].includes(style.effect)?50:1);i++){ c.save(); ret=f(c,w,h,t,style,st,1/30); c.restore(); t+=1/30; }
    if(style.effect==='lightning'&&!st.b){ c.fillStyle=style.a; c.globalAlpha=.25; c.fillRect(0,0,w,h); c.globalAlpha=1; }
    if(ret){ c.imageSmoothingEnabled=true; c.drawImage(ret,0,0,w,h); } }
  if(style.effect==='none'){ c.fillStyle='#000'; c.fillRect(0,0,w,h); }
  if(style.kal>1){ const tmp=document.createElement('canvas'); tmp.width=w; tmp.height=h; tmp.getContext('2d').drawImage(cv,0,0); c.clearRect(0,0,w,h); const n=style.kal; for(let i=0;i<n;i++){ c.save(); c.translate(w/2,h/2); c.rotate(i*TAU/n); if(i%2) c.scale(1,-1); c.beginPath(); c.moveTo(0,0); c.arc(0,0,w,0,TAU/n+.02); c.closePath(); c.clip(); c.drawImage(tmp,-w/2,-h/2); c.restore(); } }
  if(style.border>0){ c.save(); c.strokeStyle=style.borderColor; c.lineWidth=Math.max(2,style.border*.35); for(const [m,a] of [[1,.12],[.5,.2]]){ c.globalAlpha=a; c.lineWidth=Math.max(2,style.border*.35)+style.glow*.35*m; c.strokeRect(14,12,w-28,h-24); } c.globalAlpha=1; c.lineWidth=Math.max(2,style.border*.35); c.strokeRect(14,12,w-28,h-24); c.restore(); }
}
function presetCard(name,style,mine){
  const b=document.createElement('button'); b.className='pcard'; b.dataset.name=name; if(mine) b.dataset.mine='1'; b.title=name;
  const key=(mine?'m:':'')+name+JSON.stringify(style); let cv=thumbCache.get(key); if(!cv){ cv=document.createElement('canvas'); thumb({...DEF,...style},cv); thumbCache.set(key,cv); }
  const cl=document.createElement('canvas'); cl.width=cv.width; cl.height=cv.height; cl.getContext('2d').drawImage(cv,0,0); b.appendChild(cl);
  const sp=document.createElement('span'); sp.textContent=name; b.appendChild(sp);
  if(mine){ const x=document.createElement('span'); x.className='x'; x.setAttribute('role','button'); x.setAttribute('aria-label','Delete look '+name); x.textContent='×'; x.dataset.del=name; b.appendChild(x); }
  return b;
}
function renderLib(){ const g=$('#lib'); if(!g) return; g.innerHTML='';
  if(cat==='All'||cat==='Mine') P.mine.forEach(m=>g.appendChild(presetCard(m.n,m.s,true)));
  if(cat!=='Mine') PRESETS.filter(p=>cat==='All'||p.c===cat).forEach(p=>g.appendChild(presetCard(p.n,p.s,false)));
  if(cat==='Mine'&&!P.mine.length){ const d=document.createElement('p'); d.className='none'; d.textContent='Style a shape the way you like it, then tap Save look. It shows up here.'; g.appendChild(d); }
  markLib(); }
function markLib(){ const s=sh(); $$('.pcard').forEach(b=>b.classList.toggle('on',!!s&&s.preset===b.dataset.name)); }

function removePoint(){ const s=sh(); if(!s||s.pts.length<=3) return; const i=selV>=0?selV:s.pts.length-1; s.pts.splice(i,1); s.bends.splice(i,1); s.bends[(i-1+s.bends.length)%s.bends.length]=null; if(s.kind!=='outline'&&s.pts.length!==4) s.kind='outline'; selV=-1; commit(); renderPanel(); }
function moveLayer(d){ const s=sh(); if(!s) return; const i=P.shapes.indexOf(s), j=i+d; if(j<0||j>=P.shapes.length) return; P.shapes.splice(i,1); P.shapes.splice(j,0,s); commit(); renderPanel(); }
function duplicate(){ const s=sh(); if(!s) return; const c=JSON.parse(JSON.stringify(s)); c.id='s'+uid(); c.name=s.name+' copy'; c.pts=c.pts.map(p=>[p[0]+.03,p[1]+.03]); c.locked=false; c.group=null; c.media=s.media; P.shapes.push(c); sel=c.id; commit(); refreshSel(); }
function delShape(){ const s=sh(); if(!s) return; P.shapes=P.shapes.filter(o=>o!==s); RT.delete(s.id); sel=null; selV=-1; commit(); refreshSel(); toast(`Deleted ${s.name}. Ctrl+Z brings it back.`); }

function syncRef(){ const im=$('#refImg'); if(P.ui.ref&&mode==='map'){ if(im.getAttribute('src')!==P.ui.ref) im.src=P.ui.ref; im.hidden=false; im.style.opacity=P.ui.refOp; } else { im.hidden=true; } }
function syncBlack(){ const b=$('#blackBtn'); b.setAttribute('aria-pressed',P.blackout); $('#blackBadge').hidden=!P.blackout; }
function refreshSel(){ renderPanel(); renderBar(); syncRef(); touch(); }
function refreshAll(){ $('#projName').textContent=P.name; syncBlack(); syncRef(); sizeStage(); refreshSel(); }

/* ---------- home ---------- */
function thumbProject(p,cv){ cv.width=320; cv.height=180; const c=cv.getContext('2d'); c.fillStyle='#000'; c.fillRect(0,0,320,180);
  const a=p.outAR||16/9; let w=320,h=320/a; if(h>180){ h=180; w=180*a; } const F={x:(320-w)/2,y:(180-h)/2,w,h};
  for(const s of p.shapes){ if(!s.visible) continue; const st=s.style; tracePath(c,outlinePx(s,F)); if(st.effect!=='empty'&&st.effect!=='none'){ const g=c.createLinearGradient(F.x,F.y,F.x+F.w,F.y+F.h); g.addColorStop(0,st.a); g.addColorStop(1,st.b); c.fillStyle=st.effect==='solid'?st.a:g; c.fill(); }
    c.strokeStyle=st.effect==='none'?st.borderColor:'rgba(255,255,255,.35)'; c.lineWidth=st.effect==='none'?2.5:1; c.stroke(); } }
function ago(t){ const s=(Date.now()-t)/1000; if(s<60) return 'just now'; if(s<3600) return Math.round(s/60)+' min ago'; if(s<86400) return Math.round(s/3600)+' h ago'; return Math.round(s/86400)+' d ago'; }
let homeArm=null;
function openHome(){ persistNow(); renderHome(); $('#home').hidden=false; }
function closeHome(){ $('#home').hidden=true; requestAnimationFrame(sizeStage); }
function renderHome(){
  const g=$('#pgrid'); g.innerHTML=`<button class="newProj" id="newProj"><span>+</span>New project</button><button class="newProj" id="newSample"><span>◆</span>New from sample</button>`;
  IDX.slice().sort((a,b)=>b.updated-a.updated).forEach(e=>{ const p=e.id===P.id?P:loadProject(e.id); if(!p) return; const d=document.createElement('div'); d.className='proj'+(e.id===P.id?' cur':'');
    d.innerHTML=`<button class="th" data-open="${e.id}" aria-label="Open ${esc(p.name)}"><canvas></canvas></button><div class="meta"><b>${esc(p.name)}</b><span>${p.shapes.length} shape${p.shapes.length===1?'':'s'} · ${p.scenes.length} scene${p.scenes.length===1?'':'s'} · ${ago(e.updated)}</span></div>
      <div class="acts"><button class="btn" data-open="${e.id}">${e.id===P.id?'Open':'Open'}</button><button class="btn" data-ren="${e.id}">Rename</button><button class="btn" data-dup="${e.id}">Duplicate</button><button class="btn danger" data-del="${e.id}">${homeArm===e.id?'Tap again':'Delete'}</button></div>`;
    thumbProject(p,d.querySelector('canvas')); g.appendChild(d); });
  $('#newProj').onclick=()=>{ switchTo(blankProject('Untitled show '+(IDX.length+1))); setMode('map'); toast('New project. Tap + to add your first shape.'); };
  $('#newSample').onclick=()=>switchTo(sampleProject());
}
function switchTo(p){ persistNow(); P=p; if(!IDX.find(x=>x.id===p.id)) IDX.unshift({id:p.id,name:p.name,updated:Date.now()}); sel=null; selV=-1; RT.clear(); view.z=1; view.x=0; view.y=0; persistNow(); resetHist(); refreshAll(); closeHome(); }
$('#pgrid').addEventListener('click',e=>{
  const o=e.target.closest('[data-open]'), r=e.target.closest('[data-ren]'), du=e.target.closest('[data-dup]'), de=e.target.closest('[data-del]');
  if(o){ const id=o.dataset.open; if(id===P.id){ closeHome(); return; } const p=loadProject(id); if(p) switchTo(p); return; }
  if(r){ const id=r.dataset.ren, p=id===P.id?P:loadProject(id); renameDialog(p.name,n=>{ p.name=n; if(id===P.id){ $('#projName').textContent=n; persistNow(); } else { lsSet(K_P+id,JSON.stringify(p)); const e=IDX.find(x=>x.id===id); e.name=n; lsSet(K_IDX,JSON.stringify(IDX)); } renderHome(); }); return; }
  if(du){ const src=du.dataset.dup===P.id?P:loadProject(du.dataset.dup); const c=normalize(JSON.parse(JSON.stringify(src))); c.id='p'+uid(); c.name=src.name+' copy'; lsSet(K_P+c.id,JSON.stringify(strip(c))); IDX.unshift({id:c.id,name:c.name,updated:Date.now()}); lsSet(K_IDX,JSON.stringify(IDX)); renderHome(); toast('Project duplicated'); return; }
  if(de){ const id=de.dataset.del; if(homeArm!==id){ homeArm=id; renderHome(); setTimeout(()=>{ if(homeArm===id){ homeArm=null; if(!$('#home').hidden) renderHome(); } },3000); return; }
    homeArm=null; IDX=IDX.filter(x=>x.id!==id); lsDel(K_P+id); if(!IDX.length){ const s=sampleProject(); P=s; IDX=[{id:s.id,name:s.name,updated:Date.now()}]; persistNow(); resetHist(); refreshAll(); } else if(id===P.id){ P=loadProject(IDX[0].id)||sampleProject(); resetHist(); refreshAll(); }
    lsSet(K_IDX,JSON.stringify(IDX)); renderHome(); toast('Project deleted'); }
});
function renameDialog(cur,done){ openModal(`<h3>Rename project</h3><input id="renIn" maxlength="40" value="${esc(cur)}" aria-label="Project name"><div class="btnRow"><button class="btn" data-close>Cancel</button><button class="primary" id="renOk">Save</button></div>`);
  const i=$('#renIn'); i.focus(); i.select(); const ok=()=>{ const v=i.value.trim(); if(v) done(v); closeModal(); }; $('#renOk').onclick=ok; i.onkeydown=e=>{ if(e.key==='Enter') ok(); }; }

/* ---------- modal, toast ---------- */
function openModal(html){ $('#mbox').innerHTML=html; $('#modal').hidden=false; }
function closeModal(){ $('#modal').hidden=true; $('#mbox').onclick=null; }
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal'||e.target.closest('[data-close]')) closeModal(); });
let toastT=0; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
function helpHTML(){ return `<h4>iPad or iPhone with AirPlay</h4><ol><li>Open Control Center, tap <b>Screen Mirroring</b> and pick your Apple TV or AirPlay projector.</li><li>Tap <b>Project here</b>. The screen goes black except your shapes.</li><li>Use the Mapping and Play buttons on this page to switch modes while you look at the wall.</li></ol>
  <h4>PC or laptop with the projector on HDMI</h4><ol><li>Connect the HDMI cable and set the projector as an extended display (<kbd>Win</kbd>+<kbd>P</kbd> → Extend, or Displays on a Mac).</li><li>Tap <b>Projector view</b>. Drag the new tab out into its own window, move it onto the projector screen and click it once to fill the screen.</li><li>Keep editing on your main screen. The projector updates live.</li></ol>
  <h4>Chromecast or smart projector</h4><ol><li>In Chrome, open ⋮ → <b>Cast</b> → <b>Cast tab</b> and pick the projector.</li><li>Tap <b>Project here</b>.</li></ol>
  <h4>Before you map</h4><ol><li>Turn off the projector's auto keystone and set keystone to zero.</li><li>Focus the lens, then don't move the projector after mapping.</li><li>Leave the frame on <b>Match projector</b> so positions line up exactly.</li></ol>`; }
function openOutputWin(){
  const url=location.href.split('#')[0]+'#output'; let w=null;
  try{ w=window.open(url,'beamwork-projector'); }catch(e){}
  if(!w){ toast('Your browser blocked the new tab. Allow pop-ups for this site, then tap Projector view again.'); return; }
  toast('Projector view opened. Move that tab onto the projector screen and click it once to fill it.');
}
function openOutputMenu(){
  openModal(`<h3>Projector output</h3>
  <button class="opt" id="optWin"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="12" height="9" rx="1.5"/><rect x="10" y="12" width="12" height="9" rx="1.5"/></svg><div><b>Projector view</b><span>Opens a new tab with only the projection. Put it on the projector screen and keep this tab for controls.</span></div></button>
  <button class="opt" id="optHere"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 22h8M12 18v4"/></svg><div><b>Preview on this screen</b><span>Fills this screen with the output. Use it to test without a projector.</span></div></button>
  ${helpHTML()}<button class="btn" data-close>Close</button>`);
  $('#optWin').onclick=()=>{ closeModal(); openOutputWin(); };
  $('#optHere').onclick=()=>{ closeModal(); openProj(true); };
}
/* ---------- top bar + keys ---------- */
if(!OUT){
  $('#undoBtn').onclick=undo; $('#redoBtn').onclick=redo;
  $('#goProj').onclick=openOutputWin; $('#outPill').onclick=openOutputMenu;
  $('#goProj').addEventListener('contextmenu',e=>{ e.preventDefault(); openProj(true); });
  $('#blackBtn').onclick=()=>{ P.blackout=!P.blackout; syncBlack(); commit(); };
  $('#homeBtn').onclick=openHome; $('#homeClose').onclick=closeHome; $('#homeHelp').onclick=()=>openModal(`<h3>Connecting a projector</h3>${helpHTML()}<button class="primary" data-close>Got it</button>`);
  $('#projName').onclick=()=>renameDialog(P.name,n=>{ P.name=n; $('#projName').textContent=n; commit(); });
}
let nudgeT=0;
document.addEventListener('keydown',e=>{
  if(OUT) return; const tag=(e.target.tagName||'').toLowerCase(); if(['input','textarea','select'].includes(tag)&&e.key!=='Escape') return;
  const mod=e.ctrlKey||e.metaKey, k=e.key;
  if(!$('#modal').hidden){ if(k==='Escape') closeModal(); return; }
  if(!$('#home').hidden){ if(k==='Escape') closeHome(); return; }
  if(mod&&k.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(mod&&k.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if(mod&&k.toLowerCase()==='d'){ e.preventDefault(); duplicate(); return; }
  if(k==='Escape'){ if(projOpen) closeProj(); else if(ed.drawing){ ed.drawing=null; renderBar(); } else if(sel){ sel=null; selV=-1; refreshSel(); } return; }
  const kl=k.toLowerCase();
  if(kl==='p'&&!projOpen){ openOutputWin(); return; }
  if(kl==='m'){ setMode('map'); return; } if(kl==='l'){ setMode('play'); return; }
  if(kl==='e'&&projOpen){ setMode(mode==='map'?'play':'map'); return; }
  if(kl==='b'){ P.blackout=!P.blackout; syncBlack(); commit(); return; }
  if(/^[1-9]$/.test(k)&&mode==='play'){ const sc=P.scenes[+k-1]; if(sc) applyScene(sc.id); return; }
  if(k===' '&&mode==='play'){ e.preventDefault(); stepScene(1); return; }
  if((k==='Delete'||k==='Backspace')&&mode==='map'){ const s=sh(); if(!s) return; e.preventDefault(); if(selV>=0&&s.pts.length>3) removePoint(); else delShape(); return; }
  if(k.startsWith('Arrow')&&mode==='map'){ const s=sh(); if(!s||s.locked) return; e.preventDefault();
    const F=projOpen?frameOf(PW,PH):stageF(), st=e.shiftKey?10:1, dx=(k==='ArrowLeft'?-st:k==='ArrowRight'?st:0)/F.w, dy=(k==='ArrowUp'?-st:k==='ArrowDown'?st:0)/F.h;
    if(selV>=0){ for(const [o,j] of linkedRefs(s,selV)) o.pts[j]=[o.pts[j][0]+dx,o.pts[j][1]+dy]; } else { const grp=s.group?P.shapes.filter(x=>x.group===s.group):[s]; grp.forEach(o=>o.pts=o.pts.map(p=>[p[0]+dx,p[1]+dy])); }
    touch(); clearTimeout(nudgeT); nudgeT=setTimeout(commit,350); }
});
function imgData(f,max){ return new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>{ if(f.size<900000){ res(fr.result); return; } const im=new Image(); im.onload=()=>{ const sc=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=im.width*sc|0; c.height=im.height*sc|0; c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.88)); }; im.onerror=()=>res(fr.result); im.src=fr.result; }; fr.readAsDataURL(f); }); }

/* level meter */
setInterval(()=>{ const b=document.getElementById('lvlBar'); if(b) b.style.width=Math.round(AUD.lvl*100)+'%'; },80);

/* ---------- boot ---------- */
if(OUT){
  document.title='Beamwork Projector'; $('#app').hidden=true; proj.hidden=false; proj.classList.add('out'); $$('#proj .floatUI').forEach(e=>e.remove()); sizeProj();
  const fs=()=>{ try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} };
  proj.addEventListener('click',fs); document.addEventListener('keydown',e=>{ if(e.key==='f'||e.key==='F'||e.key==='Enter') fs(); });
  try{ navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{}); }catch(e){}
  if(!GP) $('#noGL').hidden=false;
  chan&&chan.postMessage({t:'hello'});
} else {
  if(!GS) $('#noGL').hidden=false;
  $('#app').classList.toggle('mode-map',mode==='map'); syncSeg(); resetHist(); refreshAll();
  if(location.hash==='#projection') openProj(false);
}
requestAnimationFrame(frame);
})();
</script>
